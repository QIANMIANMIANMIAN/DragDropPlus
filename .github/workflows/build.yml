name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: assembleRelease
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.0 platforms;android-36"
          log-accepted-android-sdk-licenses: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: ver
        run: |
          CODE=$(grep '^versionCode=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          NAME=$(grep '^versionName=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "版本：$NAME ($CODE)"

      - name: Build release
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew :app:assembleRelease --stacktrace --no-daemon

      - name: Rename artifact
        run: |
          mkdir -p out
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "找到 APK: $APK"
          cp "$APK" "out/DragDropPlus_${{ steps.ver.outputs.name }}_${{ steps.ver.outputs.code }}.apk"
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragDropPlus-${{ steps.ver.outputs.name }}
          path: out/*.apk
          retention-days: 30

      - name: Publish nightly release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          prerelease: true
          files: out/*.apk
          body: |
            自动构建 · ${{ steps.ver.outputs.name }} (${{ steps.ver.outputs.code }})
            提交：${{ github.sha }}
